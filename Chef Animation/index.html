<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Culinary Chef 3D Animation Journey</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #060609;
      color: #ffffff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Fullscreen High-Resolution Canvas */
    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      pointer-events: none;
    }

    /* Scroll Space for Multi-Frame Depth */
    .scroll-space {
      height: 600vh;
      position: relative;
      z-index: 2;
    }

    /* Loading Indicator */
    #loading-indicator {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      color: #00f0ff;
      background: rgba(10, 10, 18, 0.85);
      padding: 10px 24px;
      border-radius: 20px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      z-index: 20;
      text-transform: uppercase;
      text-align: center;
    }
  </style>

  <!-- CDNs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>

  <!-- Loading Status -->
  <div id="loading-indicator">Loading 3D Chef...</div>

  <!-- WebGL Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Scroll Space -->
  <div class="scroll-space"></div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    // 1. Three.js Scene Setup
    const canvas = document.querySelector('#webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x060609, 0.02);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 8);

    // Renderer Setup
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);

    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputEncoding = THREE.sRGBEncoding;

    // Studio Lighting
    const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.9);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(5, 8, 6);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x88ccee, 0.8);
    fillLight.position.set(-5, -2, 2);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(0xffaa00, 2, 15);
    rimLight.position.set(0, 2, -2);
    scene.add(rimLight);


    // ==========================================
    // 2. GEOMETRIC TUNNEL FRAMES
    // ==========================================

    // Frame 1: Halo Ring
    const haloGeo = new THREE.TorusGeometry(3.2, 0.05, 32, 100);
    const haloMat = new THREE.MeshBasicMaterial({ color: 0xffa500, transparent: true, opacity: 0.8 });
    const haloRing = new THREE.Mesh(haloGeo, haloMat);
    haloRing.position.set(0, 0, -2);
    scene.add(haloRing);

    // Frame 2: Cyber Box Grid Tunnel
    const gridGroup = new THREE.Group();
    for (let i = 0; i < 18; i++) {
      const boxGeo = new THREE.BoxGeometry(7, 7, 1.2);
      const wireframe = new THREE.WireframeGeometry(boxGeo);
      const line = new THREE.LineSegments(wireframe);
      line.material.color.setHex(0x00f0ff);
      line.material.transparent = true;
      line.material.opacity = 0;
      line.position.z = -i * 4.5;
      gridGroup.add(line);
    }
    scene.add(gridGroup);

    // Frame 3: DNA Helix Spiral Tunnel
    const helixGroup = new THREE.Group();
    for (let i = 0; i < 28; i++) {
      const angle = i * 0.4;
      const radius = 2.8;

      const ringGeo = new THREE.TorusGeometry(0.45, 0.04, 16, 32);
      const ringMat = new THREE.MeshBasicMaterial({
        color: i % 2 === 0 ? 0x00ffcc : 0xff0088,
        transparent: true,
        opacity: 0
      });

      const ring1 = new THREE.Mesh(ringGeo, ringMat);
      ring1.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius, -i * 2.2);

      const ring2 = new THREE.Mesh(ringGeo, ringMat.clone());
      ring2.position.set(-Math.cos(angle) * radius, -Math.sin(angle) * radius, -i * 2.2);

      helixGroup.add(ring1);
      helixGroup.add(ring2);
    }
    scene.add(helixGroup);

    // Frame 4: Sleek Neon Arc Portal Tunnel
    const arcGroup = new THREE.Group();
    for (let i = 0; i < 16; i++) {
      const arcGeo = new THREE.TorusGeometry(3.0 + (i * 0.1), 0.07, 16, 64, Math.PI * 1.5);
      const arcMat = new THREE.MeshBasicMaterial({
        color: i % 2 === 0 ? 0xb026ff : 0x00f0ff,
        transparent: true,
        opacity: 0
      });
      const arcMesh = new THREE.Mesh(arcGeo, arcMat);
      arcMesh.position.z = -i * 3.2;
      arcMesh.rotation.z = i * 0.35;
      arcGroup.add(arcMesh);
    }
    scene.add(arcGroup);

    // Frame 5: Glitch Particle Swarm
    const particlesCount = 1000;
    const pGeometry = new THREE.BufferGeometry();
    const pPositions = new Float32Array(particlesCount * 3);
    const pColors = new Float32Array(particlesCount * 3);
    const palette = [new THREE.Color(0xff0055), new THREE.Color(0x00ffcc), new THREE.Color(0xffcc00)];

    for (let i = 0; i < particlesCount * 3; i += 3) {
      const angle = Math.random() * Math.PI * 2;
      const r = 1 + Math.random() * 5;
      pPositions[i] = Math.cos(angle) * r;
      pPositions[i + 1] = Math.sin(angle) * r;
      pPositions[i + 2] = (Math.random() - 0.5) * 35;

      const c = palette[Math.floor(Math.random() * palette.length)];
      pColors[i] = c.r;
      pColors[i + 1] = c.g;
      pColors[i + 2] = c.b;
    }

    pGeometry.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
    pGeometry.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

    const pMaterial = new THREE.PointsMaterial({
      size: 0.1,
      vertexColors: true,
      transparent: true,
      opacity: 0
    });
    const glitchParticles = new THREE.Points(pGeometry, pMaterial);
    scene.add(glitchParticles);

    // Frame 6: Portal Rings
    const vortexGroup = new THREE.Group();
    for (let i = 0; i < 14; i++) {
      const vGeo = new THREE.TorusGeometry(2.4 + i * 0.18, 0.08, 16, 50);
      const vMat = new THREE.MeshBasicMaterial({ color: i % 2 === 0 ? 0xff00aa : 0x00f0ff, transparent: true, opacity: 0 });
      const ring = new THREE.Mesh(vGeo, vMat);
      ring.position.z = -i * 2.8;
      ring.rotation.z = i * 0.25;
      vortexGroup.add(ring);
    }
    scene.add(vortexGroup);


    // ==========================================
    // 3. LOAD YOUR .GLB CHEF MODEL
    // ==========================================
    let characterModel;
    let modelPivot;
    let mixer;
    let animDuration = 0;

    const loader = new THREE.GLTFLoader();
    const loadingText = document.getElementById('loading-indicator');

    loader.load(
      './character.glb',
      (gltf) => {
        characterModel = gltf.scene;

        // Auto-center model pivot
        const box = new THREE.Box3().setFromObject(characterModel);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        characterModel.position.x += (characterModel.position.x - center.x);
        characterModel.position.y += (characterModel.position.y - center.y);
        characterModel.position.z += (characterModel.position.z - center.z);

        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 2.0 / maxDim;
        characterModel.scale.set(scale, scale, scale);

        const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();
        characterModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.material) {
              child.material.roughness = 0.45;
              child.material.metalness = 0.1;
              if (child.material.map) {
                child.material.map.anisotropy = maxAnisotropy;
                child.material.map.minFilter = THREE.LinearMipmapLinearFilter;
                child.material.map.needsUpdate = true;
              }
            }
          }
        });

        // Play GLTF skeletal animation clip if present in file
        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(characterModel);
          const action = mixer.clipAction(gltf.animations[0]);
          animDuration = gltf.animations[0].duration;
          action.play();
        }

        modelPivot = new THREE.Group();
        modelPivot.add(characterModel);
        scene.add(modelPivot);

        loadingText.style.display = 'none';
        initScrollTimeline();
      },
      (xhr) => {
        if (xhr.total > 0) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          loadingText.innerText = `Loading 3D Chef: ${percent}%`;
        }
      },
      (error) => {
        console.error('GLTF Load Error:', error);
        if (window.location.protocol === 'file:') {
          loadingText.innerHTML = '⚠️ CORS Error: Open file via <b>VS Code Live Server</b>!';
          loadingText.style.color = '#ff3366';
        } else {
          loadingText.innerHTML = '⚠️ File Not Found: Rename file to <b>character.glb</b> in same folder';
          loadingText.style.color = '#ffaa00';
        }
      }
    );


    // ==========================================
    // 4. CLEAN CINEMATIC SCROLL TIMELINE
    // ==========================================
    function initScrollTimeline() {
      const mainTl = gsap.timeline({
        scrollTrigger: {
          trigger: ".scroll-space",
          start: "top top",
          end: "bottom bottom",
          scrub: 1.5,
          onUpdate: (self) => {
            if (mixer && animDuration > 0) {
              mixer.setTime(self.progress * animDuration);
            }
          }
        }
      });

      // --- 1. Initial Float & Cyber Grid Zoom ---
      mainTl
      .to(modelPivot.position, { y: -0.2, z: 0.8, duration: 2.5, ease: "power1.inOut" }, 0)
      .to(modelPivot.rotation, { x: Math.PI * 0.2, y: Math.PI * 0.4, z: 0, duration: 2.5, ease: "power1.inOut" }, 0)
      .to(haloRing.material, { opacity: 0, duration: 1 }, 0.5)
      .to(gridGroup.children.map(c => c.material), { opacity: 0.8, duration: 1.5 }, 1)
      .to(gridGroup.position, { z: 30, duration: 3.5 }, 1)

      // --- 2. DNA Helix Spiral Tunnel ---
      .to(gridGroup.children.map(c => c.material), { opacity: 0, duration: 1 }, 3.5)
      .to(helixGroup.children.map(r => r.material), { opacity: 0.9, duration: 1 }, 3.5)
      .to(helixGroup.position, { z: 35, duration: 4 }, 3.5)
      .to(helixGroup.rotation, { z: Math.PI * 3, duration: 4 }, 3.5)
      .to(modelPivot.rotation, { x: Math.PI * 0.3, y: Math.PI * 1.2, z: Math.PI * 0.1, duration: 3.5, ease: "sine.inOut" }, 3.5)

      // --- 3. Sleek Neon Arc Portal ---
      .to(helixGroup.children.map(r => r.material), { opacity: 0, duration: 1 }, 6.5)
      .to(arcGroup.children.map(a => a.material), { opacity: 0.85, duration: 1 }, 6.5)
      .to(arcGroup.position, { z: 28, duration: 3.5 }, 6.5)
      .to(arcGroup.rotation, { z: -Math.PI * 2, duration: 3.5 }, 6.5)
      .to(modelPivot.rotation, { x: Math.PI * 0.15, y: Math.PI * 1.8, z: 0, duration: 3.5, ease: "sine.inOut" }, 6.5)

      // --- 4. Particle Storm Vortex ---
      .to(arcGroup.children.map(a => a.material), { opacity: 0, duration: 1 }, 9.5)
      .to(glitchParticles.material, { opacity: 1, duration: 1 }, 9.5)
      .to(glitchParticles.rotation, { z: Math.PI * 2, duration: 3.5 }, 9.5)
      .to(modelPivot.rotation, { x: Math.PI * 0.25, y: Math.PI * 2.4, z: Math.PI * 0.05, duration: 3.5, ease: "sine.inOut" }, 9.5)

      // --- 5. Concentric Portal Rings ---
      .to(glitchParticles.material, { opacity: 0, duration: 1 }, 12.5)
      .to(vortexGroup.children.map(r => r.material), { opacity: 0.85, duration: 1 }, 12.5)
      .to(vortexGroup.position, { z: 25, duration: 3.5 }, 12.5)
      .to(vortexGroup.rotation, { z: Math.PI * 2.5, duration: 3.5 }, 12.5)

      // --- 6. Perfect Hero Landing ---
      .to(vortexGroup.children.map(r => r.material), { opacity: 0, duration: 1.5 }, 15.5)
      .to(modelPivot.position, { x: 0, y: -0.6, z: 0.5, duration: 2.5, ease: "power2.out" }, 15.5)
      .to(modelPivot.rotation, { x: 0, y: Math.PI * 4, z: 0, duration: 2.5, ease: "power2.out" }, 15.5)
      .to(haloRing.position, { x: 0, y: -0.2, z: -1 }, 15.5)
      .to(haloRing.scale, { x: 0.85, y: 0.85, z: 0.85 }, 15.5)
      .to(haloRing.material, { opacity: 0.9, duration: 2 }, 15.5);
    }


    // Render Loop
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      haloRing.rotation.z += 0.003;
      helixGroup.rotation.z += 0.002;

      // Subtle breathing motion when idle
      if (modelPivot && !ScrollTrigger.isScrolling) {
        const swayX = Math.sin(elapsedTime * 2) * 0.05;
        const swayY = Math.cos(elapsedTime * 1.5) * 0.03;
        characterModel.position.x = THREE.MathUtils.lerp(characterModel.position.x, swayX, 0.05);
        characterModel.position.y = THREE.MathUtils.lerp(characterModel.position.y, swayY, 0.05);
      }

      renderer.render(scene, camera);
    }
    animate();

    // High Resolution Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
